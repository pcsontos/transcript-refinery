name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Eszközök a .mise.toml-ból
        uses: jdx/mise-action@v4

      - name: Függőségek
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Típusellenőrzés
        run: |
          pnpm typecheck
          pnpm exec tsc -p worker/tsconfig.json --noEmit

      - name: Linter
        run: pnpm lint

      - name: Tesztek
        run: pnpm test

      - name: Offline mérés kulcs nélkül
        run: pnpm eval
        env:
          LITELLM_API_KEY: ''
          LITELLM_BASE_URL: ''
