# A Transcript Refinery konfigurációja. Másold `refinery.config.yaml` néven a
# projekt gyökerébe, vagy add meg a helyét a `--config` kapcsolóval.
#
# Egyetlen érték nem innen jön: a LITELLM_API_KEY. Az titok, ezért a `.env`-ből
# (vagy a környezetből) érkezik. Minden más beállítást kizárólag ez a fájl dönt
# el — környezeti változó nem írja felül.

vault:
  # Az Obsidian vault abszolút útvonala. Gépenként eltér, ezért nincs
  # alapértelmezése; relatív útvonal nem működhet.
  path: /Users/valaki/vault
  # A jegyzetek gyökere a vaulton belül. Elhagyható; ez az alapértelmezés.
  notes_dir: Inbox/transcript-refinery
  # Az elemenkénti mappa a jegyzetgyökéren belül: <forrás>/<sablon>/. Csak
  # {mező} szegmensek, `/`-lel elválasztva; ismert mezők: item_id, title,
  # channel, video_id, uploaded. A hiányzó mező szegmense kimarad. Elhagyható;
  # ez az alapértelmezés. Az elem mappája az első kimenetnél rögzül.
  layout: "{channel}/{item_id}"

# Feliratmappák. Az app rekurzívan minden .srt és .vtt fájlt felszed alattuk,
# és nem érdekli, mi állította elő őket. A mappa **neve** (az útvonal utolsó
# szegmense) lesz a vault-beli almappa neve, tehát beszédes nevet adj neki.
sources:
  - /Users/valaki/feliratok/youtube
  - /Users/valaki/feliratok/meetings

# Nyelvi preferencia-sorrend. Ha egy alapnévhez több felirat tartozik
# (pl. `.hu.vtt` és `.en.srt`), az itteni sorrend dönt. Üresen hagyva a
# tartalék szabály választ: .srt előbb, mint .vtt, azon belül ábécésorrend.
languages: [hu, en]

state:
  # A feldolgozottság nyilvántartása. Relatív útvonal a config fájl
  # mappájához képest értendő. Eldobható: újrafuttatáskor felépül.
  # FIGYELEM: egy korábbi (Fázis 1-es, videó-alapú sémájú) verzióból
  # maradt állapotfájlt viszont TÖRÖLNI kell — az app felismeri és
  # beszédes hibával megáll, de nem migrálja automatikusan.
  path: .state/refinery.db

logs:
  # A futásnaplók és riportok mappája. Relatív útvonal a config fájl
  # mappájához képest. Futásonként két fájl keletkezik: egy JSONL
  # eseménynapló és egy Markdown riport. Rotáció nincs — a régiek törlése a
  # te dolgod.
  dir: logs

# Fordítás (elhagyható). Bármelyik recept kész jegyzetéből célnyelvű változat
# készül, forrásreceptenként egy saját recepttel: `clean-moderate` →
# `clean-moderate-hu`. A fordítás a vaultban lévő forrásjegyzetből dolgozik,
# tehát a forrásreceptnek előbb el kell készülnie; enélkül a fordítás
# megnevezett okkal kimarad.
# Célnyelv: en, hu, nl, de, es, fr vagy it.
# translate:
#   to: hu
#   recipes: [clean-moderate, summary, notes]

# Szerep → modell. A receptek szerepet kérnek, nem modellnevet; a konkrét
# választás mérési eredmény lesz, nem vélemény (decisions/0004).
model:
  base_url: http://localhost:4000/v1
  draft: claude-sonnet-5
  judge: grok-4-fast-reasoning
  # A bíró pontozói fussanak-e alapból (a determinisztikus kapuk mindig
  # futnak). false esetén egy futásra sem kapcsolható vissza parancssorból;
  # a --no-judge csak kikapcsolni tud.
  # judge_enabled: true
  # Egy recept leghosszabb futásideje percben (tört is lehet). Ennél tovább
  # nem fut: újrapróbálkozás nélkül leáll, a Telegram rákérdez, hogy újra
  # próbálja-e. Hiányában 25.
  # recipe_timeout_minutes: 25
  # Az életjel időköze percben, amíg egy recept fut (terminál és Telegram).
  # Hiányában 10.
  # heartbeat_minutes: 10
  # Receptenkénti modell (opcionális): a `draft` felülbírálása egy-egy
  # receptnél. A kulcs pontos receptazonosító; a fordítás (pl. notes-hu)
  # külön kulcs, nem örököl a forrásrecepttől. A bíró mindig a `judge`.
  # recipes:
  #   notes: claude-sonnet-5
  # Telegramról (`/model`) ezekre a modellekre lehet váltani: modell → `structured`
  # (sémás JSON-t ad, a notes, flashcards és bloom csak ilyet kap) vagy `text`.
  # Mindnek kell ár a `pricing` alatt, mint a `recipes` modelljeinek.
  # switchable:
  #   claude-sonnet-5: structured
  #   gemini-flash: text

# USD egymillió tokenre, **modellnév szerint**, be- és kimenetre. Minden
# használt modellnek (model.draft, model.judge, model.recipes, model.switchable) kell ár; a
# fölösleges sor nem baj. Azért konfigurációból és nem beégetett
# ártáblázatból, mert az avul: ellenőrizd a `refinery check-pricing`
# paranccsal, valahányszor a modellek változnak (ellenőrizve: 2026-09-11).
pricing:
  claude-sonnet-5: { input_per_million: 2.00, output_per_million: 10.00 }
  grok-4-fast-reasoning: { input_per_million: 1.25, output_per_million: 2.50 }

# Futásonkénti költségplafon dollárban. Kötelező: köteg nem indul felső korlát
# nélkül. A korpusz mért mediánjából egy elem nagyjából 8 cent, tehát az
# 5,00-s alapértelmezés megállít egy teljes korpuszfutást, és kikényszeríti a
# szándékos felülbírálást.
cost_limit_usd: 5.00
